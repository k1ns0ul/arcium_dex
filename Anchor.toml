[toolchain]
package_manager = "yarn"

[features]
resolution = true
skip-lint = false

[programs.devnet]
arcium_hello_world = "uoJLpAPHDHekRCVMnUdXrtMPDqnPpPbgTT137AhW4uY"

[programs.localnet]
arcium_hello_world = "uoJLpAPHDHekRCVMnUdXrtMPDqnPpPbgTT137AhW4uY"

[registry]
url = "https://api.apr.dev"

[provider]
cluster = "devnet"
wallet = "~/.config/solana/id.json"

[scripts]
test = "yarn run ts-mocha -p ./tsconfig.json -t 1000000 \"tests/**/*.ts\""

[test]
startup_wait = 180000
shutdown_wait = 2000
upgradeable = false

[test.validator]
bind_address = "0.0.0.0"
faucet_port = 9900
ledger = ".anchor/test-ledger"
rpc_port = 8899
